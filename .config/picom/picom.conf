backend = "glx";
vsync = true;
corner-radius = 10;
shadow = false;
fading = true;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [ "class_g = 'dota2'" ];
rounded-corners-exclude = [ "class_g = 'dota2'" ];
unredir-if-possible = true;

animations = (
  { triggers = ["open", "show"]; preset = "appear"; duration = 0.18; },
  { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.15; },
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.2; }
);
